[project]
name = "bakery-lens"
version = "0.1.0"
description = "Bakery Lens - Crop-based Inference Optimization with Adaptive Strategies"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26.0",
    "opencv-python>=4.9.0",
    "supervision>=0.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bakery_lens"]
