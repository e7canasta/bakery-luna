[project]
name = "bakery-runtime"
version = "0.1.0"
description = "Bakery Runtime - Model Inference Abstraction Layer"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "bakery-catalog",
    "openvino>=2024.0.0",
    "numpy>=1.26.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bakery_runtime"]

[tool.uv.sources]
bakery-catalog = { workspace = true }
