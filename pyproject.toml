[project]
name = "bakery-luna"
version = "0.1.0"
description = "Bakery Luna - Modular Vision Pipeline Package"
readme = "README.md"
requires-python = ">=3.11.14,<3.12"
dependencies = [
    # Core utilities
    "psutil>=7.1.2",
    "supervision>=0.26.1",
    "bakery-catalog",
    "bakery-runtime",
]
# Heavy dependencies are now in bakery-exporters package
# Install with: pip install bakery-exporters[full]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
]
